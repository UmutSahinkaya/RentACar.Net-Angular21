<!-- eslint-disable @angular-eslint/template/label-has-associated-control -->
<blank [pageTitle]="pageTitle()" pageIcon="bi-zoom-in" [showStatusCheckbox]="false" [showStatus]="true"
    [status]="data().isActive" [showAduit]="true" [audit]="data()" [loading]="loading()" size="col-md-5">
    <div class="admin-card">
        <div class="card-header">
            <h6><i class="bi bi-info-circle text-primary me-2"></i>Temel Bilgiler</h6>
        </div>
        <div class="card-body">
            <div class="detail-grid">
                <!-- firstname -->
                <div class="detail-item">
                    <label class="detail-label"> Adı</label>
                    <span class="detail-value">
                        {{data().firstName}}
                    </span>
                </div>
                <!-- lastname -->
                <div class="detail-item">
                    <label class="detail-label"> Soyadı</label>
                    <span class="detail-value">
                        {{data().lastName}}
                    </span>
                </div>
                <!-- username -->
                <div class="detail-item">
                    <label class="detail-label"> Kullanıcı Adı</label>
                    <span class="detail-value">
                        {{data().userName}}
                    </span>
                </div>
                <!-- email -->
                <div class="detail-item">
                    <label class="detail-label"> Email</label>
                    <span class="detail-value">
                        {{data().email}}
                    </span>
                </div>
            </div>
        </div>
    </div>
    <div class="admin-card">
        <div class="card-header">
            <h6><i class="bi bi-key text-warning me-2"></i>Yetki Bilgileri</h6>
        </div>
        <div class="card-body">
            <div class="detail-grid">
                <div class="detail-item">
                    <label class="detail-label"> Şube Adı</label>
                    <span class="detail-value">
                        {{data().branchName}}
                    </span>
                </div>
                <div class="detail-item">
                    <label class="detail-label"> Rol</label>
                    <span class="detail-value">
                        {{data().roleName}}
                    </span>
                </div>
            </div>
        </div>
    </div>
</blank>
